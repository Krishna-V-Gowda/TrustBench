[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trustbench"
version = "0.1.1"
description = "Exact-source differential and metamorphic verification for analytical and ML systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna V. Gowda" }]
keywords = [
  "differential-testing",
  "metamorphic-testing",
  "statistical-software",
  "machine-learning",
  "reproducibility"
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
trustbench = "trustbench.cli:main"

[project.urls]
Repository = "https://github.com/Krishna-V-Gowda/TrustBench"
Subject = "https://github.com/Krishna-V-Gowda/EDA-InsightLab-Apex"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
